<!DOCTYPE html>
<html lang="zh-Hant">

<title>跑江湖地圖．禪師走過的路</title>
<style>
:root{--bg:#f7f4ee;--ink:#2a2622;--ink2:#5d564e;--ink3:#8d857a;--line:#ddd5c8;--gold:#c9972e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);display:grid;place-items:center;
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif;
  line-height:1.8;padding:24px}
.box{width:100%;max-width:470px;background:#fffdf8;border:1px solid var(--line);
  border-radius:12px;padding:30px 30px 26px;box-shadow:0 8px 34px rgba(0,0,0,.05)}
h1{font-size:22px;letter-spacing:.08em;margin:0 0 4px;font-weight:600}
.sub{font-size:13px;color:var(--ink3);margin-bottom:18px}
.desc{font-size:13.5px;color:var(--ink2);margin:0 0 20px;padding-bottom:18px;
  border-bottom:1px solid #efe9de}
.desc b{color:var(--ink)}
label{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px;letter-spacing:.08em}
.row{display:flex;gap:8px}
input{flex:1;padding:9px 13px;border:1px solid var(--line);border-radius:7px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--ink);letter-spacing:.06em}
input:focus{outline:none;border-color:var(--gold)}
button{border:1px solid var(--gold);background:var(--gold);color:#fff;border-radius:7px;
  padding:9px 20px;font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.5;cursor:default}
#msg{margin-top:13px;font-size:12.5px;color:var(--ink3);min-height:20px}
#msg.bad{color:#c0392b}
#msg.ok{color:#2e7d4f}
.foot{margin-top:20px;padding-top:15px;border-top:1px solid #efe9de;
  font-size:11.5px;color:var(--ink3);line-height:1.7}
.bar{height:3px;background:#efe9de;border-radius:3px;overflow:hidden;margin-top:11px;display:none}
.bar i{display:block;height:100%;width:30%;background:var(--gold);
  animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{margin-left:-30%}100%{margin-left:100%}}
</style>
</head>
<body>
<div class="box">
  <h1>跑江湖地圖．禪師走過的路</h1>
  <div class="sub">給小朋友的版本</div>
  <p class="desc">他們是真的用走的——從四川走到江西，從福建走到河北。<b>五段故事、二十二位祖師</b>，點圖釘就能看他走過哪些地方、走了幾公里。</p>
  <label for="pw">請輸入密碼</label>
  <div class="row">
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="••••••••">
    <button id="go">開啟</button>
  </div>
  <div class="bar" id="bar"><i></i></div>
  <div id="msg"></div>
  <div class="foot">寶嚴禪寺　教學研習用　｜　內容已加密，沒有密碼無法讀取。<br>
    年代多為推定、部分古地名的今地比定存疑，詳見頁內說明。</div>
</div>

<script>
(function(){
"use strict";
var KEY = "baoyan-jianghu-map";       // sessionStorage 鍵：同一分頁開其他頁面不必再輸一次
var ENC = JSON.parse(document.getElementById("payload").textContent);
var msg = document.getElementById("msg"), bar = document.getElementById("bar"),
    pw = document.getElementById("pw"), go = document.getElementById("go");

function b64(s){ var r = atob(s), a = new Uint8Array(r.length);
  for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
function eq(a, b){ if (a.length !== b.length) return false;
  var d = 0; for (var i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; }

async function unlock(pass){
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
                                           "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt:b64(ENC.s), iterations:ENC.it, hash:"SHA-256" }, base, 512);
  var all = new Uint8Array(bits);
  var aesRaw = all.slice(0, 32), macRaw = all.slice(32, 64);

  // 先驗 HMAC（encrypt-then-MAC），對了才解密
  var macKey = await crypto.subtle.importKey("raw", macRaw,
                  { name:"HMAC", hash:"SHA-256" }, false, ["sign"]);
  var iv = b64(ENC.i), ct = b64(ENC.c);
  var signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv, 0); signed.set(ct, iv.length);
  var mac = new Uint8Array(await crypto.subtle.sign("HMAC", macKey, signed));
  if (!eq(mac, b64(ENC.m))) throw new Error("bad-password");

  var aesKey = await crypto.subtle.importKey("raw", aesRaw, { name:"AES-CBC" },
                                             false, ["decrypt"]);
  var plainGz = await crypto.subtle.decrypt({ name:"AES-CBC", iv:iv }, aesKey, ct);
  var ds = new DecompressionStream("gzip");
  return await new Response(new Blob([plainGz]).stream().pipeThrough(ds)).text();
}

async function open_(pass, silent){
  bar.style.display = "block";
  msg.className = ""; msg.textContent = "解開中⋯";
  go.disabled = true;
  var html;
  try { html = await unlock(pass); }
  catch (e) {
    bar.style.display = "none"; go.disabled = false;
    try { sessionStorage.removeItem(KEY); } catch (_) {}
    if (!silent) { msg.className = "bad"; msg.textContent = "密碼不對，再試一次。"; }
    else { msg.textContent = ""; }
    return false;
  }
  try { sessionStorage.setItem(KEY, pass); } catch (_) {}
  msg.className = "ok"; msg.textContent = "已開啟";
  document.open(); document.write(html); document.close();
  return true;
}

go.onclick = function(){
  var v = pw.value.trim();
  if (!v) { msg.className = "bad"; msg.textContent = "請先輸入密碼。"; return; }
  open_(v, false);
};
pw.addEventListener("keydown", function(e){ if (e.key === "Enter") go.click(); });

// 同一分頁已解過就直接進去
var saved = null;
try { saved = sessionStorage.getItem(KEY); } catch (_) {}
if (saved) open_(saved, true); else pw.focus();

// 瀏覽器解密需要「安全來源」：https://、localhost，或直接開啟本機檔案。
// 從預覽視窗、data: 或 http:// 開啟時 crypto.subtle 不存在，要講清楚原因。
if (!window.crypto || !crypto.subtle) {
  msg.className = "bad";
  go.disabled = true;
  msg.innerHTML = (location.protocol === "https:" || location.protocol === "file:")
    ? "這個瀏覽器太舊，請改用新版 Chrome、Edge、Firefox 或 Safari。"
    : "無法解密：請用 <b>https://</b> 網址開啟，或把檔案存到電腦後直接開啟。"
      + "（目前是 <b>" + location.protocol + "</b>，瀏覽器不允許在此環境解密。）";
} else if (!window.DecompressionStream) {
  msg.className = "bad";
  go.disabled = true;
  msg.textContent = "這個瀏覽器太舊（不支援 DecompressionStream），請改用新版 Chrome、Edge、Firefox 或 Safari。";
}
})();
</script>
